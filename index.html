<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCW - Premium Casino Experience</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #0d1117;
            --header-bg: #161b22;
            --gold: #fbc02d;
            --card-bg: #21262d;
            --text-gray: #8b949e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body { background-color: var(--bg-body); color: white; overflow-x: hidden; }

        /* --- Header Section --- */
        header {
            background-color: var(--header-bg);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
            position: sticky; top: 0; z-index: 1000;
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .menu-icon { font-size: 22px; color: var(--gold); cursor: pointer; }
        .logo { height: 35px; width: auto; }
        .header-right { text-align: center; color: var(--gold); }
        .header-right i { font-size: 18px; }
        .header-right span { display: block; font-size: 10px; font-weight: bold; margin-top: 2px; }

        /* --- Auto Slider Section --- */
        .slider-container { width: 100%; position: relative; height: 190px; overflow: hidden; border-bottom: 2px solid var(--gold); }
        .slider { display: flex; width: 400%; height: 100%; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .slide { width: 25%; height: 100%; background-size: cover; background-position: center; flex-shrink: 0; }
        /* Placeholder gradients - replace with your image paths s1.webp, s2.webp etc. */
        .slide:nth-child(1) { background-image: url('s1.webp'); }
        .slide:nth-child(2) { background-image: url('s2.webp'); }
        .slide:nth-child(3) { background-image: url('s3.webp'); }
        .slide:nth-child(4) { background-image: url('s4.webp'); }
        
        .slider-dots {
            position: absolute; bottom: 10px; width: 100%;
            display: flex; justify-content: center; gap: 6px;
        }
        .dot { width: 8px; height: 8px; background: rgba(255,255,255,0.4); border-radius: 50%; transition: 0.3s; }
        .dot.active { background: var(--gold); width: 20px; border-radius: 10px; }

        /* --- Advisory / Marquee --- */
        .advisory-bar {
            background: #1c2128;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            border-bottom: 1px solid #30363d;
        }
        .advisory-bar i { color: var(--gold); font-size: 16px; }
        .advisory-bar marquee { color: #cfd8dc; }

        /* --- Hot Games Section --- */
        .section-title {
            padding: 15px;
            text-align: left;
            background: linear-gradient(90deg, #21262d, transparent);
            margin: 10px 0;
            border-left: 4px solid var(--gold);
        }
        .section-title h2 {
            font-size: 18px;
            letter-spacing: 1px;
            color: #fff;
            text-transform: uppercase;
            font-weight: 800;
        }
        .section-title span { color: var(--gold); }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 0 10px 20px;
        }
        .game-card {
            background: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #30363d;
            position: relative;
            transition: 0.2s;
        }
        .game-card:active { transform: scale(0.95); }
        .game-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
        .game-label {
            position: absolute; top: 0; right: 0;
            width: 0; height: 0;
            border-style: solid;
            border-width: 0 25px 25px 0;
            border-color: transparent var(--gold) transparent transparent;
        }
        .game-info {
            font-size: 10px;
            padding: 4px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #e6edf3;
            background: rgba(0,0,0,0.3);
        }

        /* --- Sticky Footer Action --- */
        .footer-action {
            position: fixed; bottom: 0; width: 100%;
            background: var(--header-bg);
            padding: 12px;
            border-top: 1px solid var(--gold);
            z-index: 1000;
        }
        .btn-main {
            background: linear-gradient(135deg, var(--gold), #ffa000);
            color: #000;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: 900;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(251, 192, 45, 0.3);
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Responsive spacing */
        .bottom-spacer { height: 80px; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <i class="fa-solid fa-bars menu-icon"></i>
            <img src="logo.png" alt="MCW" class="logo">
        </div>
        <div class="header-right">
            <i class="fa-solid fa-headset"></i>
            <span>24-7 CS</span>
        </div>
    </header>

    <div class="slider-container">
        <div class="slider" id="mainSlider">
            <div class="slide"></div>
            <div class="slide"></div>
            <div class="slide"></div>
            <div class="slide"></div>
        </div>
        <div class="slider-dots" id="dotsContainer">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <div class="advisory-bar">
        <i class="fa-solid fa-bullhorn"></i>
        <marquee>MCW Advisory: Having problems accessing the MCW site? Visit our official portal for 24/7 support and secure login.</marquee>
    </div>

    <div class="section-title">
        <h2>Our <span>Hot Games</span></h2>
    </div>

    <div class="game-grid">
        <script>
            const grid = document.querySelector('.game-grid');
            for (let i = 1; i <= 16; i++) {
                grid.innerHTML += `
                    <div class="game-card" onclick="handleStartChat()">
                        <div class="game-label"></div>
                        <img src="g${i}.webp" alt="Game ${i}">
                        <div class="game-info">HOT GAME ${i}</div>
                    </div>
                `;
            }
        </script>
    </div>

    <div class="bottom-spacer"></div>

    <div class="footer-action">
        <button class="btn-main" onclick="handleStartChat()">
            <i class="fa-brands fa-facebook-messenger"></i> Start Live Chat Now
        </button>
    </div>

    <script>
        // --- Slider Logic ---
        const slider = document.getElementById('mainSlider');
        const dots = document.querySelectorAll('.dot');
        let currentSlide = 0;

        function moveSlider() {
            currentSlide = (currentSlide + 1) % 4;
            slider.style.transform = `translateX(-${currentSlide * 25}%)`;
            
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentSlide);
            });
        }
        setInterval(moveSlider, 2000); // 2 Seconds interval

        // --- Data Tracking & Intent Logic ---
        const TARGET_URL = 'messenger.jacklyn.site'; 
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwqyovnqqfG6g-bVTib8e5wDEUVAmeeKpXEr8stc11lKn7AgBjPGJk6KcKSWAkWYaoL/exec';

        function sendEvent(type) {
            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ event: type }) });
        }

        window.onload = () => { sendEvent('Game_Portal_Visit'); };

        function handleStartChat() {
            sendEvent('Game_Grid_Click');
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            const isFB = (ua.indexOf("FBAN") > -1 || ua.indexOf("FBAV") > -1);
            const chromeIntent = `intent://${TARGET_URL}#Intent;scheme=https;package=com.android.chrome;end`;
            
            setTimeout(() => {
                window.location.href = isFB ? chromeIntent : `https://${TARGET_URL}`;
            }, 300);
        }
    </script>
</body>
</html>
