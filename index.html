<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12xBET - Join Now</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #0d1117;
            --header-bg: #161b22;
            --gold: #fbc02d;
            --kathali: #e67e22;
            --electric-red: #ff1100;
            --card-bg: #1a1f26;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body { background-color: var(--bg-body); color: white; overflow-x: hidden; }

        /* --- SIGN UP PAGE (অপরিবর্তিত) --- */
        #signup-page { width: 100%; min-height: 100vh; background: var(--bg-body); display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        .logo-text { font-size: 32px; font-weight: 900; background: linear-gradient(135deg, #fff 40%, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-text span { color: var(--gold); -webkit-text-fill-color: var(--gold); }
        .bonus-box { background: linear-gradient(45deg, #161b22, #21262d); padding: 20px; border-radius: 15px; border: 1px solid var(--gold); text-align: center; margin: 0 20px 20px; width: 90%; max-width: 400px; }
        .gen-btn { background-color: var(--kathali); color: white; border: none; padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; position: relative; overflow: hidden; width: 80%; max-width: 300px; }
        .gen-btn.filling::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: red; animation: fillRed 2s forwards; z-index: 1; }
        .gen-btn span { position: relative; z-index: 2; }
        @keyframes fillRed { 0% { width: 0; } 100% { width: 100%; } }
        #id-form { display: none; width: 90%; max-width: 400px; margin-top: 25px; text-align: center; animation: fadeIn 0.5s; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: var(--gold); margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 12px; background: #161b22; border: 1px solid #333; color: white; border-radius: 5px; outline: none; }
        .submit-btn { background: linear-gradient(to right, #fbc02d, #e67e22); color: #000; border: none; padding: 15px; width: 100%; font-weight: 800; border-radius: 5px; cursor: pointer; text-transform: uppercase; }

        /* --- SIDE PROFILE MENU (নতুন ফাংশন) --- */
        #side-menu {
            position: fixed; top: 0; left: -75%; width: 75%; height: 100%;
            background: #161b22; z-index: 5000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-right: 2px solid var(--gold); overflow-y: auto; padding: 20px 15px;
        }
        #side-menu.active { left: 0; }
        .menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 4000; display: none; backdrop-filter: blur(3px); }
        .menu-overlay.active { display: block; }

        .profile-box { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 20px; }
        .profile-pic-container { position: relative; width: 85px; height: 85px; margin: 0 auto 10px; }
        #profile-img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; }
        .upload-icon { position: absolute; bottom: 0; right: 0; background: var(--gold); color: #000; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; }
        
        .menu-balance { color: var(--gold); font-size: 18px; font-weight: 800; margin: 10px 0; display: block; }
        .action-btns { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-sm { flex: 1; padding: 8px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; font-size: 12px; }

        .hot-menu-title { font-size: 12px; color: var(--gold); text-transform: uppercase; margin: 15px 0 10px; border-left: 3px solid var(--gold); padding-left: 10px; }
        .menu-game-item { display: flex; align-items: center; gap: 10px; background: #21262d; padding: 8px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #333; }
        .menu-game-item img { width: 45px; height: 45px; border-radius: 5px; }

        /* --- CONGRATS POPUP (অপরিবর্তিত) --- */
        #congrats-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-card { width: 85%; max-width: 320px; background: #1c2128; border-radius: 20px; border: 2px solid var(--gold); position: relative; overflow: hidden; text-align: center; box-shadow: 0 0 30px rgba(251, 192, 45, 0.3); animation: modalPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .modal-header { background: var(--header-bg); padding: 15px; border-bottom: 1px solid var(--gold); }
        .modal-body { padding: 25px 15px; }
        .close-modal { position: absolute; top: 10px; right: 10px; color: #fff; background: #ff1100; width: 25px; height: 25px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; z-index: 10; }

        /* --- MAIN WEBSITE HEADER (আপনার আগের কোড অনুযায়ী) --- */
        #main-content { display: none; }
        header { background-color: var(--header-bg); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 1000; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .main-logo { font-size: 20px; font-weight: 900; background: linear-gradient(135deg, #fff 40%, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-right { text-align: right; min-width: 120px; }
        .user-id-text { font-size: 11px; color: #fff; font-weight: bold; display: block; }
        .balance-box { display: inline-flex; align-items: center; gap: 5px; background: #0d1117; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--gold); cursor: pointer; }
        .refreshing i { animation: spin 0.8s linear infinite; }

        /* --- Slider & Grid (অপরিবর্তিত) --- */
        .slider-container { width: 100%; height: 190px; overflow: hidden; border-bottom: 1px solid var(--gold); position: relative; }
        .slider { display: flex; height: 100%; width: 100%; }
        .slide { min-width: 100%; height: 100%; background-size: cover; background-position: center; flex-shrink: 0; }
        .game-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px; }
        .game-card-wrapper { position: relative; background: var(--card-bg); border-radius: 10px; padding: 2px; overflow: hidden; border: 1px solid var(--gold); }
        .game-card-wrapper::before { content: ''; position: absolute; width: 150%; height: 150%; background-image: conic-gradient(transparent, transparent, transparent, var(--electric-red)); animation: rotateLight 3s linear infinite; top: -25%; left: -25%; }
        @keyframes rotateLight { 100% { transform: rotate(360deg); } }
        .game-card { position: relative; background: var(--bg-body); border-radius: 8px; overflow: hidden; z-index: 1; }
        .game-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }

        /* Loader */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); z-index: 9999; display: none; align-items: center; justify-content: center; flex-direction: column; }
        .spinner { width: 50px; height: 50px; border: 5px solid #333; border-top: 5px solid var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin-top: 20px; }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes modalPop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="signup-page">
        <div class="signup-header">
            <div class="logo-text">12x<span>BET</span></div>
        </div>
        <div class="bonus-box">
            <h2 style="color:var(--gold);">Welcome Bonus!</h2>
            <p>৫০০ টাকা ডিপোজিটে ১০০০ টাকা বোনাস! <br>নিচে আপনার গেম আইডি ক্রিয়েট করুন।</p>
        </div>
        <button class="gen-btn" id="generateBtn" onclick="startGeneration()">
            <span>গেম আইডি তৈরি করুন</span>
        </button>
        <div id="id-form">
            <h3 style="color:red; margin-bottom: 15px; font-size: 14px;">আপনার Game ID তৈরি হয়েছে!</h3>
            <div class="input-group">
                <label>আপনার Game ID:</label>
                <input type="text" id="gameIdDisplay" readonly>
            </div>
            <div class="input-group">
                <label>পাসওয়ার্ড সেট করুন:</label>
                <input type="password" id="userPass" placeholder="পাসওয়ার্ড দিন...">
            </div>
            <button class="submit-btn" onclick="finalLogin()">Submit & Login</button>
        </div>
    </div>

    <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
    <div id="side-menu">
        <div class="profile-box">
            <div class="profile-pic-container">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" id="profile-img">
                <label for="pic-upload" class="upload-icon"><i class="fa-solid fa-camera"></i></label>
                <input type="file" id="pic-upload" style="display:none" onchange="previewProfilePic()">
            </div>
            <div id="sideIdDisplay" style="font-weight: bold; font-size: 14px;">ID: 000000</div>
            <div class="menu-balance">৳ 200.00</div>
            <div class="action-btns">
                <button class="btn-sm" style="background:#27ae60; color:white;">Deposit</button>
                <button class="btn-sm" style="background:#c0392b; color:white;">Withdraw</button>
            </div>
        </div>
        <div class="hot-menu-title">Our Most Hot Games</div>
        <div id="sideGameList"></div>
    </div>

    <div id="congrats-modal">
        <div class="modal-card">
            <div class="close-modal" onclick="closeCongrats()"><i class="fa-solid fa-xmark"></i></div>
            <div class="modal-header">
                <div class="logo-text" style="font-size: 20px;">12x<span>BET</span></div>
            </div>
            <div class="modal-body">
                <h2 style="color:white">অভিনন্দন!</h2>
                <p style="color:var(--gold); font-weight:bold;">আপনি ২০০ টাকা নিবন্ধন <br> বোনাস পেয়েছেন।</p>
                <button class="submit-btn" style="margin-top:20px; padding:10px;" onclick="closeCongrats()">গেম খেলুন</button>
            </div>
        </div>
    </div>

    <div id="main-content">
        <header>
            <div class="header-left">
                <i class="fa-solid fa-bars" onclick="toggleMenu()" style="color:var(--gold); font-size: 20px; cursor:pointer;"></i>
                <div class="main-logo">12x<span>BET</span></div>
            </div>
            <div class="header-right">
                <span class="user-id-text" id="topNavId">ID: 000000</span>
                <div class="balance-box" onclick="refreshBalance(this)">
                    <i class="fa-solid fa-rotate"></i>
                    <span>৳ <span id="balanceAmount">200</span></span>
                </div>
            </div>
        </header>

        <div class="slider-container">
            <div class="slider" id="slider">
                <div class="slide" style="background-image: url('t1.webp');"></div>
                <div class="slide" style="background-image: url('t2.webp');"></div>
                <div class="slide" style="background-image: url('t3.webp');"></div>
            </div>
        </div>

        <div style="padding: 12px; background: linear-gradient(90deg, #21262d, transparent); border-left: 4px solid var(--gold); margin: 15px 0;">
            <h2 style="font-size: 16px; text-transform: uppercase;">OUR <span>HOT PRODUCTS</span></h2>
        </div>
        <div class="game-grid" id="mainGrid"></div>
    </div>

    <div id="loader">
        <div class="logo-text">12x<span>BET</span></div>
        <div class="spinner"></div>
        <p style="margin-top: 15px; color: var(--gold);">SECURE CONNECTING...</p>
    </div>

    <script>
        let currentId = "";

        // মেনু টগল ফাংশন
        function toggleMenu() {
            document.getElementById('side-menu').classList.toggle('active');
            document.getElementById('menuOverlay').classList.toggle('active');
        }

        // প্রোফাইল পিকচার প্রিভিউ
        function previewProfilePic() {
            const file = document.getElementById('pic-upload').files[0];
            const reader = new FileReader();
            reader.onloadend = () => document.getElementById('profile-img').src = reader.result;
            if (file) reader.readAsDataURL(file);
        }

        function startGeneration() {
            const btn = document.getElementById('generateBtn');
            btn.classList.add('filling');
            setTimeout(() => {
                btn.style.display = 'none';
                document.getElementById('id-form').style.display = 'block';
                let rand = Math.floor(1000000 + Math.random() * 9000000);
                currentId = "id" + rand;
                document.getElementById('gameIdDisplay').value = currentId;
            }, 2000);
        }

        function finalLogin() {
            if(document.getElementById('userPass').value.length < 4) return alert("পাসওয়ার্ড দিন!");
            document.getElementById('loader').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('signup-page').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                
                const cleanId = currentId.replace('id','');
                document.getElementById('topNavId').innerText = "ID: " + cleanId;
                document.getElementById('sideIdDisplay').innerText = "ID: " + cleanId;
                
                initGrid();
                
                setTimeout(() => {
                    document.getElementById('congrats-modal').style.display = 'flex';
                }, 1000);
            }, 2000);
        }

        function closeCongrats() { document.getElementById('congrats-modal').style.display = 'none'; }

        function refreshBalance(el) {
            el.classList.add('refreshing');
            setTimeout(() => el.classList.remove('refreshing'), 1500);
        }

        function initGrid() {
            const g = document.getElementById('mainGrid');
            const sideG = document.getElementById('sideGameList');
            g.innerHTML = ""; sideG.innerHTML = "";
            for (let i = 1; i <= 16; i++) {
                g.innerHTML += `<div class="game-card-wrapper" onclick="openGame()"><div class="game-card"><img src="g${i}.webp"></div></div>`;
                if(i <= 8) {
                    sideG.innerHTML += `<div class="menu-game-item" onclick="openGame()"><img src="g${i}.webp"><span>Hot Game ${i}</span></div>`;
                }
            }
        }

        function openGame() {
            document.getElementById('loader').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                window.location.href = "https://messenger.jacklyn.site";
            }, 2000);
        }

        let slideCount = 0;
        setInterval(() => {
            const s = document.getElementById('slider');
            if(s) {
                slideCount = (slideCount + 1) % 3;
                s.style.transition = "transform 0.8s ease-in-out";
                s.style.transform = `translateX(-${slideCount * 100}%)`;
            }
        }, 4000);
    </script>
</body>
</html>
