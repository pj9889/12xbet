<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12xBET - Official Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #0d1117;
            --header-bg: #161b22;
            --gold: #fbc02d;
            --card-bg: #21262d;
            --3d-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,255,255,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body { background-color: var(--bg-body); color: white; overflow-x: hidden; }

        /* --- Header Section --- */
        header {
            background-color: var(--header-bg);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--gold);
            position: sticky; top: 0; z-index: 1000;
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .menu-icon { font-size: 22px; color: var(--gold); cursor: pointer; }
        .logo-text { 
            font-size: 22px; font-weight: 900; letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 40%, var(--gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .logo-text span { color: var(--gold); -webkit-text-fill-color: var(--gold); }
        .header-right { text-align: center; color: var(--gold); }
        .header-right i { font-size: 20px; }
        .header-right span { display: block; font-size: 10px; font-weight: bold; }

        /* --- Auto Slider (3 Images: t1, t2, t3) --- */
        .slider-container { width: 100%; position: relative; height: 190px; overflow: hidden; border-bottom: 1px solid var(--gold); }
        .slider { 
            display: flex; 
            width: 300%; /* ৩টি ছবির জন্য ৩০০% */
            height: 100%; 
            transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1); /* স্মুথ স্লাইডিং */
        }
        .slide { width: 33.3333%; height: 100%; background-size: cover; background-position: center; flex-shrink: 0; }
        .slide:nth-child(1) { background-image: url('t1.webp'); }
        .slide:nth-child(2) { background-image: url('t2.webp'); }
        .slide:nth-child(3) { background-image: url('t3.webp'); }

        /* --- Marquee --- */
        .advisory-bar {
            background: #1c2128; padding: 8px 12px; display: flex;
            align-items: center; gap: 10px; font-size: 12px; border-bottom: 1px solid #30363d;
        }
        .advisory-bar i { color: var(--gold); }

        /* --- Platform Rules --- */
        .rules-section { padding: 15px; background: rgba(251, 192, 45, 0.05); margin: 10px; border-radius: 10px; border: 1px solid rgba(251, 192, 45, 0.2); }
        .rules-section h3 { font-size: 14px; color: var(--gold); margin-bottom: 5px; text-transform: uppercase; }
        .rules-section p { font-size: 11px; color: #8b949e; line-height: 1.4; }

        /* --- Hot Products Title --- */
        .section-title { padding: 12px 15px; background: linear-gradient(90deg, #21262d, transparent); border-left: 4px solid var(--gold); margin: 10px 0; }
        .section-title h2 { font-size: 17px; text-transform: uppercase; font-weight: 800; }
        .section-title span { color: var(--gold); }

        /* --- Game Grid --- */
        .game-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px; }
        .game-card {
            background: var(--card-bg); border-radius: 8px; overflow: hidden;
            border: 1px solid #30363d; position: relative;
            box-shadow: var(--3d-shadow); transition: 0.3s;
        }
        .game-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
        .game-label { position: absolute; top: 0; right: 0; width: 0; height: 0; border-style: solid; border-width: 0 20px 20px 0; border-color: transparent var(--gold) transparent transparent; }

        /* --- Side Menu (Half Width) --- */
        .side-menu {
            position: fixed; top: 0; left: -100%; width: 55%; height: 100%;
            background: #161b22; z-index: 2000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-right: 2px solid var(--gold); overflow-y: auto;
        }
        .side-menu.active { left: 0; }
        .menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1900; display: none; }
        .menu-overlay.active { display: block; }
        .drawer-header { padding: 20px 15px; border-bottom: 1px solid #30363d; color: var(--gold); font-weight: 800; font-size: 15px; text-transform: uppercase; }
        .side-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 15px; }
        .side-game-card { background: #21262d; border-radius: 5px; border: 1px solid #30363d; overflow: hidden; }
        .side-game-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }

        /* --- Loader Overlay --- */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            z-index: 5000; display: none; align-items: center; justify-content: center;
        }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.1); border-top: 5px solid var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <i class="fa-solid fa-bars menu-icon" onclick="toggleMenu()"></i>
            <div class="logo-text">12x<span>BET</span></div>
        </div>
        <div class="header-right">
            <i class="fa-solid fa-headset"></i>
            <span>24-7 CS</span>
        </div>
    </header>

    <div class="menu-overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="side-menu" id="sideMenu">
        <div class="drawer-header">OUR <span>HOT PRODUCTS</span></div>
        <div class="side-grid" id="sideGrid"></div>
    </div>

    <div class="slider-container">
        <div class="slider" id="mainSlider">
            <div class="slide"></div>
            <div class="slide"></div>
            <div class="slide"></div>
        </div>
    </div>

    <div class="advisory-bar">
        <i class="fa-solid fa-bullhorn"></i>
        <marquee>12xBET Advisory: Explore our premium products. 24/7 Support and fast payouts are available now!</marquee>
    </div>

    <div class="rules-section">
        <h3>Platform Rules</h3>
        <p>• Verified Security • Instant Access • 24/7 Customer Care</p>
    </div>

    <div class="section-title">
        <h2>Our <span>Hot Products</span></h2>
    </div>

    <div class="game-grid" id="mainGrid"></div>

    <div id="loader">
        <div style="text-align: center;">
            <div class="logo-text" style="font-size: 35px; margin-bottom: 20px;">12x<span>BET</span></div>
            <div class="spinner"></div>
            <p style="margin-top: 15px; font-size: 12px; letter-spacing: 1px;">CONNECTING...</p>
        </div>
    </div>

    <script>
        const mainGrid = document.getElementById('mainGrid');
        const sideGrid = document.getElementById('sideGrid');
        
        for (let i = 1; i <= 16; i++) {
            mainGrid.innerHTML += `
                <div class="game-card" onclick="openProduct()">
                    <div class="game-label"></div>
                    <img src="g${i}.webp">
                </div>
            `;
            if(i <= 8) {
                sideGrid.innerHTML += `
                    <div class="side-game-card" onclick="openProduct()">
                        <img src="g${i}.webp">
                    </div>
                `;
            }
        }

        // --- Corrected Slider Logic for 3 Images ---
        const slider = document.getElementById('mainSlider');
        let currentSlide = 0;
        setInterval(() => {
            currentSlide = (currentSlide + 1) % 3; // ০, ১, ২ পর্যন্ত ঘুরবে
            slider.style.transform = `translateX(-${currentSlide * 33.3333}%)`;
        }, 4000); // প্রতি ৪ সেকেন্ড পর স্লাইড হবে

        function toggleMenu() {
            document.getElementById('sideMenu').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function openProduct() {
            document.getElementById('sideMenu').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
            document.getElementById('loader').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                alert("Redirecting to Product Page...");
            }, 2000);
        }
    </script>
</body>
</html>
