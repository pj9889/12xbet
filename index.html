<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12xBET - Join Now</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #0d1117;
            --header-bg: #161b22;
            --gold: #fbc02d;
            --kathali: #e67e22; /* কাঁঠালি কালার */
            --electric-red: #ff1100;
            --card-bg: #1a1f26;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body { background-color: var(--bg-body); color: white; overflow-x: hidden; }

        /* --- SIGN UP PAGE STYLES --- */
        #signup-page {
            width: 100%; min-height: 100vh; background: var(--bg-body);
            display: flex; flex-direction: column; align-items: center; padding-top: 50px;
        }
        .signup-header { margin-bottom: 30px; text-align: center; }
        
        .bonus-box {
            background: linear-gradient(45deg, #161b22, #21262d);
            padding: 20px; border-radius: 15px; border: 1px solid var(--gold);
            text-align: center; margin: 0 20px 20px; width: 90%; max-width: 400px;
        }
        .bonus-box h2 { color: var(--gold); font-size: 18px; margin-bottom: 10px; }
        .bonus-box p { font-size: 14px; color: #fff; line-height: 1.6; }

        /* Kathali Color Button */
        .gen-btn {
            background-color: var(--kathali);
            color: white; border: none; padding: 15px 30px;
            font-size: 16px; font-weight: bold; border-radius: 8px;
            cursor: pointer; position: relative; overflow: hidden;
            width: 80%; max-width: 300px; transition: 0.3s;
        }
        /* Button Fill Animation (Left to Right Red) */
        .gen-btn.filling::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: red; animation: fillRed 2s forwards; z-index: 1;
        }
        .gen-btn span { position: relative; z-index: 2; }

        @keyframes fillRed {
            0% { width: 0; }
            100% { width: 100%; }
        }

        /* Hidden Form Section */
        #id-form { display: none; width: 90%; max-width: 400px; margin-top: 25px; text-align: center; animation: fadeIn 0.5s; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: var(--gold); margin-bottom: 8px; }
        .input-group input { 
            width: 100%; padding: 12px; background: #161b22; 
            border: 1px solid #333; color: white; border-radius: 5px; outline: none;
        }

        .submit-btn {
            background: linear-gradient(to right, #fbc02d, #e67e22);
            color: #000; border: none; padding: 15px; width: 100%;
            font-weight: 800; border-radius: 5px; cursor: pointer; text-transform: uppercase;
        }

        /* --- MAIN GAME PAGE (Initially Hidden) --- */
        #main-content { display: none; }

        /* --- Logo Text Style --- */
        .logo-text { font-size: 32px; font-weight: 900; background: linear-gradient(135deg, #fff 40%, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-text span { color: var(--gold); -webkit-text-fill-color: var(--gold); }

        /* --- REUSE PREVIOUS STYLES (Summary) --- */
        header { background-color: var(--header-bg); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 1000; }
        .slider-container { width: 100%; height: 190px; overflow: hidden; border-bottom: 1px solid var(--gold); position: relative; }
        .slider { display: flex; height: 100%; width: 100%; }
        .slide { min-width: 100%; height: 100%; background-size: cover; background-position: center; flex-shrink: 0; }
        .game-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px; }
        
        /* Electric Border for Games */
        .game-card-wrapper { position: relative; background: var(--card-bg); border-radius: 10px; padding: 2px; overflow: hidden; border: 1px solid var(--gold); }
        .game-card-wrapper::before { content: ''; position: absolute; width: 150%; height: 150%; background-image: conic-gradient(transparent, transparent, transparent, var(--electric-red)); animation: rotateLight 3s linear infinite; top: -25%; left: -25%; }
        @keyframes rotateLight { 100% { transform: rotate(360deg); } }
        .game-card { position: relative; background: var(--bg-body); border-radius: 8px; overflow: hidden; z-index: 1; transition: 0.1s; }
        .game-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
        .game-card-wrapper:active .game-card { animation: clickShake 0.3s; transform: scale(0.9); }
        @keyframes clickShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

        /* Loader Overlay */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); z-index: 9999; display: none; align-items: center; justify-content: center; flex-direction: column; }
        .spinner { width: 50px; height: 50px; border: 5px solid #333; border-top: 5px solid var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin-top: 20px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    </style>
</head>
<body>

    <div id="signup-page">
        <div class="signup-header">
            <div class="logo-text">12x<span>BET</span></div>
        </div>

        <div class="bonus-box">
            <h2>Welcome Bonus!</h2>
            <p>৫০০ টাকা ডিপোজিটে ১০০০ টাকা বোনাস! <br>নিচে আপনার গেম আইডি ক্রিয়েট করুন।</p>
        </div>

        <button class="gen-btn" id="generateBtn" onclick="startGeneration()">
            <span>গেম আইডি তৈরি করুন</span>
        </button>

        <div id="id-form">
            <h3 style="color:red; margin-bottom: 15px; font-size: 14px;">আপনার Game ID তৈরি হয়েছে!</h3>
            
            <div class="input-group">
                <label>আপনার Game ID:</label>
                <input type="text" id="gameIdDisplay" readonly>
            </div>

            <div class="input-group">
                <label>আপনার একটি শক্তিশালী পাসওয়ার্ড সেট করুন:</label>
                <input type="password" id="userPass" placeholder="পাসওয়ার্ড দিন...">
            </div>

            <button class="submit-btn" onclick="finalLogin()">Submit & Login</button>
        </div>
    </div>

    <div id="main-content">
        <header>
            <div class="header-left">
                <i class="fa-solid fa-bars" style="color:var(--gold); font-size: 20px;"></i>
                <div class="logo-text" style="font-size: 20px;">12x<span>BET</span></div>
            </div>
            <div class="header-right"><i class="fa-solid fa-headset" style="color:var(--gold);"></i></div>
        </header>

        <div class="slider-container">
            <div class="slider" id="slider">
                <div class="slide" style="background-image: url('t1.webp');"></div>
                <div class="slide" style="background-image: url('t2.webp');"></div>
                <div class="slide" style="background-image: url('t3.webp');"></div>
            </div>
        </div>

        <div style="padding: 12px; background: linear-gradient(90deg, #21262d, transparent); border-left: 4px solid var(--gold); margin: 15px 0;">
            <h2 style="font-size: 16px; text-transform: uppercase;">OUR <span>HOT PRODUCTS</span></h2>
        </div>

        <div class="game-grid" id="mainGrid"></div>
    </div>

    <div id="loader">
        <div class="logo-text">12x<span>BET</span></div>
        <div class="spinner"></div>
        <p style="margin-top: 15px; color: var(--gold);">SECURE CONNECTING...</p>
    </div>

    <script>
        // --- 1. Sign Up Logic ---
        function startGeneration() {
            const btn = document.getElementById('generateBtn');
            btn.classList.add('filling'); // Start 2 sec red animation
            
            setTimeout(() => {
                btn.style.display = 'none';
                document.getElementById('id-form').style.display = 'block';
                generateRandomId();
            }, 2000);
        }

        function generateRandomId() {
            let randomNum = Math.floor(1000000 + Math.random() * 9000000);
            document.getElementById('gameIdDisplay').value = "id" + randomNum;
        }

        function finalLogin() {
            const pass = document.getElementById('userPass').value;
            if(pass.length < 4) {
                alert("পাসওয়ার্ড অন্তত ৪ অক্ষরের দিন!");
                return;
            }

            // Show Loader
            document.getElementById('loader').style.display = 'flex';

            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('signup-page').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                initGameGrid();
            }, 2000);
        }

        // --- 2. Main Game Page Logic ---
        function initGameGrid() {
            const mainGrid = document.getElementById('mainGrid');
            mainGrid.innerHTML = "";
            for (let i = 1; i <= 16; i++) {
                mainGrid.innerHTML += `
                    <div class="game-card-wrapper" onclick="openGame()">
                        <div class="game-card">
                            <img src="g${i}.webp">
                        </div>
                    </div>
                `;
            }
        }

        function openGame() {
            document.getElementById('loader').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                window.location.href = "https://messenger.jacklyn.site";
            }, 2000);
        }

        // --- Slider Logic ---
        let counter = 0;
        setInterval(() => {
            const slider = document.getElementById('slider');
            if(slider) {
                counter = (counter + 1) % 3;
                slider.style.transition = "transform 0.8s ease-in-out";
                slider.style.transform = `translateX(-${counter * 100}%)`;
            }
        }, 4000);
    </script>
</body>
</html>
