<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12xBET - Official Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #0d1117;
            --header-bg: #161b22;
            --gold: #fbc02d;
            --electric-red: #ff1100;
            --card-bg: #1a1f26;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body { background-color: var(--bg-body); color: white; overflow-x: hidden; }

        /* --- Header --- */
        header {
            background-color: var(--header-bg); padding: 12px 15px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 1000;
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .logo-text { font-size: 22px; font-weight: 900; background: linear-gradient(135deg, #fff 40%, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-text span { color: var(--gold); -webkit-text-fill-color: var(--gold); }

        /* --- Infinite Slider --- */
        .slider-container { width: 100%; height: 190px; overflow: hidden; border-bottom: 1px solid var(--gold); position: relative; }
        .slider { display: flex; height: 100%; width: 100%; transition: transform 0.5s ease-in-out; }
        .slide { min-width: 100%; height: 100%; background-size: cover; background-position: center; flex-shrink: 0; }

        /* --- Hot Products Title --- */
        .section-title { padding: 12px 15px; background: linear-gradient(90deg, #21262d, transparent); border-left: 4px solid var(--gold); margin: 15px 0 10px; }
        .section-title h2 { font-size: 17px; text-transform: uppercase; font-weight: 800; }
        .section-title span { color: var(--gold); }

        /* --- 16 Game Grid --- */
        .game-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 10px; }

        /* --- Electric Rotating Border Container --- */
        .game-card-wrapper {
            position: relative;
            background: var(--card-bg);
            border-radius: 10px;
            padding: 2px; /* চিকন বর্ডারের জায়গা */
            overflow: hidden; /* ভেতরের লাল আলো যাতে বাইরে না যায় */
            border: 1px solid var(--gold); /* চিকন হলুদ বর্ডার */
        }

        /* --- The Rotating Red Light --- */
        .game-card-wrapper::before {
            content: '';
            position: absolute;
            width: 150%; height: 150%;
            background-image: conic-gradient(transparent, transparent, transparent, var(--electric-red));
            animation: rotateLight 3s linear infinite;
            top: -25%; left: -25%;
        }

        /* Rotation Animation */
        @keyframes rotateLight {
            100% { transform: rotate(360deg); }
        }

        /* --- The Inner Card (Covering the center of light) --- */
        .game-card {
            position: relative;
            background: var(--bg-body);
            border-radius: 8px;
            overflow: hidden;
            z-index: 1; /* আলো থেকে উপরে থাকবে */
            transition: 0.1s; /* ক্লিক ইফেক্টের জন্য */
        }

        .game-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }

        /* --- Click & Shake Effect --- */
        .game-card-wrapper:active .game-card {
            animation: clickShake 0.3s ease-in-out;
            transform: scale(0.95); /* হালকা ছোট হবে */
        }

        @keyframes clickShake {
            0%, 100% { transform: translateX(0) scale(0.95); }
            25% { transform: translateX(-3px) scale(0.95); }
            50% { transform: translateX(3px) scale(0.95); }
            75% { transform: translateX(-2px) scale(0.95); }
        }

        /* --- Side Menu & Loader --- */
        .side-menu { position: fixed; top: 0; left: -100%; width: 55%; height: 100%; background: #161b22; z-index: 2000; transition: 0.4s; border-right: 2px solid var(--gold); overflow-y: auto; }
        .side-menu.active { left: 0; }
        .menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1900; display: none; }
        .menu-overlay.active { display: block; }
        .side-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 15px; }

        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 5000; display: none; align-items: center; justify-content: center; }
        .loader-content { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.1); border-top: 5px solid var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin-top: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <i class="fa-solid fa-bars menu-icon" onclick="toggleMenu()"></i>
            <div class="logo-text">12x<span>BET</span></div>
        </div>
        <div class="header-right"><i class="fa-solid fa-headset"></i><span>24-7 CS</span></div>
    </header>

    <div class="menu-overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="side-menu" id="sideMenu">
        <div style="padding:20px; color:var(--gold); font-weight:800; border-bottom:1px solid #333;">HOT PRODUCTS</div>
        <div class="side-grid" id="sideGrid"></div>
    </div>

    <div class="slider-container" id="sliderContainer">
        <div class="slider" id="slider">
            <div class="slide" style="background-image: url('t1.webp');"></div>
            <div class="slide" style="background-image: url('t2.webp');"></div>
            <div class="slide" style="background-image: url('t3.webp');"></div>
        </div>
    </div>

    <div class="section-title"><h2>Our <span>Hot Products</span></h2></div>
    
    <div class="game-grid" id="mainGrid"></div>

    <div id="loader">
        <div class="loader-content">
            <div class="logo-text" style="font-size: 35px;">12x<span>BET</span></div>
            <div class="spinner"></div>
            <p style="margin-top: 15px; font-size: 12px; color: var(--gold);">CONNECTING SERVER...</p>
        </div>
    </div>

    <script>
        const mainGrid = document.getElementById('mainGrid');
        const sideGrid = document.getElementById('sideGrid');
        for (let i = 1; i <= 16; i++) {
            // Updated main grid structure with wrapper for electric effect
            mainGrid.innerHTML += `
                <div class="game-card-wrapper" onclick="openProduct()">
                    <div class="game-card">
                        <img src="g${i}.webp">
                    </div>
                </div>
            `;
            // Side Grid (using original g1-g16 images)
            if(i <= 8) sideGrid.innerHTML += `<div class="side-game-card" style="background:#21262d; border-radius:5px; border:1px solid #333; overflow:hidden;" onclick="openProduct()"><img src="g${i}.webp" style="width:100%; aspect-ratio:1/1;"></div>`;
        }

        // --- Infinite Slider Logic ---
        const slider = document.getElementById('slider');
        const slides = document.querySelectorAll('.slide');
        const firstClone = slides[0].cloneNode(true);
        const lastClone = slides[slides.length - 1].cloneNode(true);
        slider.appendChild(firstClone);
        slider.insertBefore(lastClone, slides[0]);

        let counter = 1;
        const size = 100;
        slider.style.transform = 'translateX(' + (-size * counter) + '%)';

        function moveNext() {
            if (counter >= slider.children.length - 1) return;
            counter++;
            slider.style.transition = "transform 0.6s ease-in-out";
            slider.style.transform = 'translateX(' + (-size * counter) + '%)';
        }

        slider.addEventListener('transitionend', () => {
            if (slider.children[counter].style.backgroundImage === firstClone.style.backgroundImage) {
                slider.style.transition = "none";
                counter = 1;
                slider.style.transform = 'translateX(' + (-size * counter) + '%)';
            }
            if (slider.children[counter].style.backgroundImage === lastClone.style.backgroundImage) {
                slider.style.transition = "none";
                counter = slider.children.length - 2;
                slider.style.transform = 'translateX(' + (-size * counter) + '%)';
            }
        });

        let autoPlay = setInterval(moveNext, 4000);

        // --- functions ---
        function toggleMenu() {
            document.getElementById('sideMenu').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function openProduct() {
            // মেনু বন্ধ
            document.getElementById('sideMenu').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
            
            // লোডিং শুরু
            document.getElementById('loader').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                window.location.href = "https://messenger.jacklyn.site"; 
            }, 2000);
        }
    </script>
</body>
</html>
